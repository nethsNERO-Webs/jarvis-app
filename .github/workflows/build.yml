name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ccache libffi-dev libssl-dev libltdl-dev libsqlite3-dev zlib1g-dev openjdk-17-jdk zip unzip autoconf libtool pkg-config libncurses5-dev libncursesw5-dev libtinfo5 cmake
          python -m pip install --upgrade pip
          python -m pip install "cython<3.0.0" buildozer

      - name: Build APK
        run: buildozer --debug android debug

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
